<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | サンプル不動産</title>
  <meta name="description" content="お問い合わせフォーム。電話・メールでも受け付けております。営業時間は平日9:00-18:00、定休日は土日祝。">
  <link rel="canonical" href="/contact.html">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<header class="header"><div class="container header__inner">
  <a class="logo" href="/"><span class="logo__mark"></span><span>サンプル不動産</span></a>
  <button id="nav-toggle" class="nav-toggle btn btn--ghost">メニュー</button>
  <nav id="nav" class="nav">
    <a href="/services.html">サービス</a>
    <a href="/company.html">会社情報</a>
    <a href="/voices.html">お客様の声</a>
    <a href="/contact.html" aria-current="page" class="btn">お問い合わせ</a>
  </nav></div></header>

<main>
  <section class="section"><div class="container">
    <h1 class="section-title">お問い合わせ</h1>

    <div class="card">
      <form id="contact-form" class="form" aria-describedby="contact-desc">
        <p id="contact-desc" class="subtle">必要事項をご入力の上、送信してください。*は必須です。</p>
        <div class="form__row">
          <div>
            <label for="name">お名前*</label>
            <input id="name" name="name" class="input" required>
          </div>
          <div>
            <label for="email">メールアドレス*</label>
            <input id="email" name="email" type="email" class="input" required>
          </div>
        </div>
        <div class="form__row">
          <div>
            <label for="tel">電話番号</label>
            <input id="tel" name="tel" type="tel" class="input" inputmode="tel">
          </div>
          <div>
            <label for="type">ご相談種別</label>
            <select id="type" name="type">
              <option>売買仲介</option>
              <option>賃貸仲介</option>
              <option>売却相談</option>
              <option>投資相談</option>
            </select>
          </div>
        </div>
        <div>
          <label for="message">ご相談内容*</label>
          <textarea id="message" name="message" class="textarea" required></textarea>
        </div>
        <button class="btn btn--primary" type="submit">送信する</button>
      </form>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>連絡先</h2>
      <p>TEL: <a href="tel:09012345678">090-1234-5678</a><br>MAIL: <a href="mailto:info@example.com">info@example.com</a></p>
      <p>営業時間: 平日9:00-18:00 / 定休日: 土日祝</p>
      <iframe class="map" src="https://www.google.com/maps?q=Tokyo&t=&z=13&ie=UTF8&iwloc=&output=embed" loading="lazy" title="Google Map"></iframe>
    </div>
  </div></section>
</main>

<footer class="footer section"><div class="container footer__grid">
  <div><div class="logo"><span class="logo__mark"></span><span>サンプル不動産</span></div><small>© <span id="year"></span> サンプル不動産</small></div>
  <nav><ul style="list-style:none; padding:0; margin:0; display:grid; gap:8px">
    <li><a href="/">トップ</a></li>
    <li><a href="/services.html">サービス</a></li>
    <li><a href="/company.html">会社情報</a></li>
  </ul></nav>
  <div><h3 style="margin-top:0">SNS</h3><div style="display:flex; gap:10px">
    <a class="badge" href="#" aria-label="Xへ">X</a>
    <a class="badge" href="#" aria-label="Facebookへ">Facebook</a>
  </div></div>
</div></footer>
<script src="/assets/js/main.js" defer></script>
<script>document.getElementById('year').textContent = new Date().getFullYear()</script>
</body>
</html>
